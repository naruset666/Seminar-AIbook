<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>


    <!-- Profile -->
    <main class="profile-page">

        <section class="profile-card">

            <!-- Profile Header -->
            <div class="profile-header">

                <div class="profile-avatar">
                    <span>U</span>
                </div>

                <div class="profile-info">

                    <p class="profile-label">MY PROFILE</p>

                    <h1>U Want Reading?</h1>

                    <p class="profile-email">
                        user@example.com
                    </p>

                </div>

            </div>


            <!-- Divider -->
            <div class="profile-divider"></div>


            <!-- Information -->
            <div class="profile-section">

                <h2>Personal Information</h2>

                <div class="info-grid">

                    <div class="info-item">
                        <span class="info-label">Name</span>
                        <span class="info-value">Your Name</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Email</span>
                        <span class="info-value">user@example.com</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Birthday</span>
                        <span class="info-value">20 December</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Member since</span>
                        <span class="info-value">2026</span>
                    </div>

                </div>

            </div>


            <!-- Preferences -->
            <div class="profile-section">

                <h2>My Preferences</h2>

                <div class="preference-list">

                    <div class="preference-item">
                        <span>Favorite genre</span>
                        <strong>—</strong>
                    </div>

                    <div class="preference-item">
                        <span>Reading mood</span>
                        <strong>—</strong>
                    </div>

                    <div class="preference-item">
                        <span>Favorite author</span>
                        <strong>—</strong>
                    </div>

                </div>

            </div>


            <!-- Buttons -->
            <div class="profile-actions">

                <button class="edit-button">
                    Edit Profile
                </button>

                <button class="logout-button">
                    Log out
                </button>

            </div>

        </section>

    </main>


    <script src="js/navbar.js"></script>

</body>

</html>
